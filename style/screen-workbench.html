<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawix - Workbench</title>
<link rel="stylesheet" href="ui.css">
<script defer src="app.js"></script>
</head>
<body data-page="workbench" data-shell="app" data-title="Database" data-active="database">
<template id="main">
  <div class="surface">
    <div class="surf-head">
      <div class="tt">
        <div class="h"><svg class="ic"><use href="icons.svg#i-database"/></svg>Database Workbench</div>
      </div>
      <div class="sp"></div>
      <div class="acts">
        <div class="dropdown"><div class="field js-pop" style="width:160px;justify-content:space-between;cursor:pointer"><span data-val>clawix · local</span><svg class="ic s"><use href="icons.svg#i-chevron-down"/></svg></div>
          <div class="pop-menu" style="left:auto;right:0;transform-origin:top right"><div class="it" data-pick>clawix · local<span class="ck"><svg class="ic xs"><use href="icons.svg#i-check"/></svg></span></div><div class="it" data-pick>prod · read-only</div></div></div>
        <button class="ctl m btn-secondary">Format</button>
        <button class="ctl m btn-secondary">Save draft</button>
        <button class="ctl m btn-primary"><svg class="ic xs"><use href="icons.svg#i-play"/></svg>Run</button>
      </div>
    </div>

    <div class="wb">
      <div class="wb-side">
        <div class="sec-lbl">Profiles</div>
        <div class="mrow on"><span class="ec"><svg class="ic s"><use href="icons.svg#i-database"/></svg></span><div class="mt"><div class="nm">clawix</div><div class="sub">local · sqlite</div></div></div>
        <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-shield"/></svg></span><div class="mt"><div class="nm">prod</div><div class="sub">read-only</div></div></div>

        <div class="sec-lbl">Collections</div>
        <div class="tree">
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-stack"/></svg>chats</div>
          <div class="tn sel"><svg class="ic s"><use href="icons.svg#i-message"/></svg>messages</div>
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-folder"/></svg>projects</div>
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-puzzle"/></svg>skills</div>
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-key"/></svg>secrets</div>
        </div>

        <div class="sec-lbl">Query drafts</div>
        <div class="tree">
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-file"/></svg>recent messages</div>
          <div class="tn"><svg class="ic s"><use href="icons.svg#i-file"/></svg>token usage by day</div>
        </div>
      </div>

      <div class="wb-main">
        <div class="wb-editor">
          <div class="ttl"><span class="t">Query</span><span class="sp"></span><span class="t-sub" style="font-size:10px">⌘↵ to run</span></div>
          <div class="code mono"><span class="cp"><svg class="ic s"><use href="icons.svg#i-copy"/></svg></span><div class="cc"><span class="tk-k">select</span> id, role, content, created
<span class="tk-k">from</span> messages
<span class="tk-k">where</span> chat_id = <span class="tk-s">'refactor-login'</span>
<span class="tk-k">order by</span> created <span class="tk-k">desc</span>
<span class="tk-k">limit</span> <span class="tk-f">20</span>;<span class="term-cur" style="background:#d6d6d6"></span></div></div>
        </div>

        <div class="wb-results">
          <div class="ttl">Results · 20 rows · 11ms</div>
          <div class="list">
            <div class="tbl">
              <div class="th" style="grid-template-columns:48px 80px 1fr 110px"><div>id</div><div>role</div><div>content</div><div>created</div></div>
              <div class="tr sel-row" style="grid-template-columns:48px 80px 1fr 110px;background:var(--sel)"><div class="mono">812</div><div>user</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Run the auth tests too.</div><div class="mono" style="color:var(--text-3)">14:15:02</div></div>
              <div class="tr" style="grid-template-columns:48px 80px 1fr 110px"><div class="mono">811</div><div>assistant</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Moved validation into AuthService…</div><div class="mono" style="color:var(--text-3)">14:14:48</div></div>
              <div class="tr" style="grid-template-columns:48px 80px 1fr 110px"><div class="mono">810</div><div>user</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Refactor the login flow so validation…</div><div class="mono" style="color:var(--text-3)">14:13:20</div></div>
              <div class="tr" style="grid-template-columns:48px 80px 1fr 110px"><div class="mono">809</div><div>assistant</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">All 12 tests passed.</div><div class="mono" style="color:var(--text-3)">14:09:11</div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="wb-insp">
        <div class="sec-lbl" style="padding-top:2px">Row detail</div>
        <div class="kv">
          <div class="r"><span class="k">id</span><span class="v mono">812</span></div>
          <div class="r"><span class="k">role</span><span class="v">user</span></div>
          <div class="r"><span class="k">chat_id</span><span class="v mono" style="font-size:10px">refactor-login</span></div>
          <div class="r"><span class="k">tokens</span><span class="v">38</span></div>
          <div class="r"><span class="k">created</span><span class="v mono" style="font-size:10px">14:15:02</span></div>
        </div>

        <div class="sec-lbl">History</div>
        <div class="hist">
          <div class="wb-hrow"><div class="o"><span class="status c-ok">approved</span></div><div class="q">select id, role, content from messages…</div></div>
          <div class="wb-hrow"><div class="o"><span class="status c-danger">blocked</span></div><div class="q">delete from messages where chat_id…</div></div>
          <div class="wb-hrow"><div class="o"><span class="status c-warn">dry-run</span></div><div class="q">update messages set pinned = 1…</div></div>
        </div>
      </div>
    </div>
  </div>
</template>
</body>
</html>
