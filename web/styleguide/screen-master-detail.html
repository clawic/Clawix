<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawix - Master-detail</title>
<link rel="stylesheet" href="ui.css">
<script defer src="app.js"></script>
</head>
<body data-page="master-detail" data-shell="app" data-title="Secrets" data-active="secrets">
<template id="main">
  <div class="surface">
    <div class="surf-head">
      <div class="tt">
        <div class="h"><svg class="ic"><use href="icons.svg#i-key"/></svg>Secrets</div>
        <div class="s">Encrypted credentials the agent can use in a tool call without ever seeing the value.</div>
      </div>
      <div class="sp"></div>
      <div class="acts">
        <span class="status c-ok"><svg class="ic xs"><use href="icons.svg#i-check"/></svg>Unlocked</span>
        <span class="iconbtn s"><svg class="ic s"><use href="icons.svg#i-clock"/></svg></span>
        <span class="iconbtn s"><svg class="ic s"><use href="icons.svg#i-shield"/></svg></span>
        <button class="ctl m btn-primary"><svg class="ic xs"><use href="icons.svg#i-plus"/></svg>New secret</button>
      </div>
    </div>

    <div class="md2">
      <div class="md-list">
        <div class="ltop">
          <div class="seg js-seg" style="align-self:stretch"><span class="ind"></span><button class="on">All</button><button>Stale 90d</button></div>
          <div class="field"><svg class="ic s"><use href="icons.svg#i-search"/></svg><input placeholder="Search secrets…"></div>
        </div>
        <div class="cap">12 of 12</div>
        <div class="scroll">
          <div class="mrow on"><span class="ec"><svg class="ic s"><use href="icons.svg#i-key"/></svg></span><div class="mt"><div class="nm">OPENAI_API_KEY</div><div class="sub">API key</div></div></div>
          <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-key"/></svg></span><div class="mt"><div class="nm">GITHUB_TOKEN</div><div class="sub">Token · scoped</div></div></div>
          <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-database"/></svg></span><div class="mt"><div class="nm">DATABASE_URL</div><div class="sub">Connection string</div></div></div>
          <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-shield"/></svg></span><div class="mt"><div class="nm">SIGNING_KEY</div><div class="sub">Certificate</div></div><span class="status c-danger" title="Possibly compromised"><svg class="ic xs"><use href="icons.svg#i-alert"/></svg></span></div>
          <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-globe"/></svg></span><div class="mt"><div class="nm">WEBHOOK_SECRET</div><div class="sub">Shared secret</div></div></div>
          <div class="mrow"><span class="ec"><svg class="ic s"><use href="icons.svg#i-key"/></svg></span><div class="mt"><div class="nm">SMTP_PASSWORD</div><div class="sub">Password · idle 142d</div></div></div>
        </div>
      </div>

      <div class="md-detail">
        <div class="md-head">
          <span class="ec"><svg class="ic l"><use href="icons.svg#i-key"/></svg></span>
          <div>
            <div class="nm">OPENAI_API_KEY</div>
            <div class="meta"><span>API key</span><span>·</span><span>Added 12 days ago</span><span>·</span><span class="status c-ok"><svg class="ic xs"><use href="icons.svg#i-check"/></svg>In use</span></div>
          </div>
          <div class="sp"></div>
          <span class="iconbtn"><svg class="ic s"><use href="icons.svg#i-pencil"/></svg></span>
        </div>

        <div class="set-card" style="margin-bottom:22px">
          <div class="set-row"><div class="rl"><div class="rt">Value</div></div>
            <span class="bullets" style="margin-left:auto"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="iconbtn s"><svg class="ic s"><use href="icons.svg#i-eye"/></svg></span>
            <span class="iconbtn s"><svg class="ic s"><use href="icons.svg#i-copy"/></svg></span></div>
          <div class="set-row"><div class="rl"><div class="rt">Scope</div><div class="rd">Where the agent may use it</div></div>
            <div class="dropdown"><div class="field js-pop" style="width:140px;justify-content:space-between;cursor:pointer"><span data-val>Global</span><svg class="ic s"><use href="icons.svg#i-chevron-down"/></svg></div>
              <div class="pop-menu" style="left:auto;right:0;transform-origin:top right"><div class="it" data-pick>Global<span class="ck"><svg class="ic xs"><use href="icons.svg#i-check"/></svg></span></div><div class="it" data-pick>This project</div><div class="it" data-pick>This chat only</div></div></div></div>
          <div class="set-row"><div class="rl"><div class="rt">Last used</div></div><div style="font-size:12px;color:var(--text-2)">2 hours ago</div></div>
        </div>

        <div class="sec-lbl">Used by</div>
        <div class="list">
          <div class="xrow"><svg class="ic s"><use href="icons.svg#i-message"/></svg><div class="mt"><div class="nm">Refactor the login flow</div></div><span class="meta">just now</span></div>
          <div class="xrow"><svg class="ic s"><use href="icons.svg#i-puzzle"/></svg><div class="mt"><div class="nm">Skill · Summarize a thread</div></div><span class="meta">3 chats</span></div>
        </div>

        <div class="sec-lbl">Activity</div>
        <div class="list">
          <div class="xrow"><svg class="ic s"><use href="icons.svg#i-eye"/></svg><div class="mt"><div class="nm">Read in a tool call</div><div class="sub">Brokered · value redacted from transcript</div></div><span class="meta">2:14 PM</span></div>
          <div class="xrow"><svg class="ic s"><use href="icons.svg#i-pencil"/></svg><div class="mt"><div class="nm">Value rotated</div></div><span class="meta">12 days ago</span></div>
        </div>

        <div style="margin-top:24px"><button class="ctl m btn-danger"><svg class="ic xs"><use href="icons.svg#i-trash"/></svg>Delete secret</button></div>
      </div>
    </div>
  </div>
</template>
</body>
</html>
